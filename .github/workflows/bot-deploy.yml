name: Deploy Telegram Bot

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/bot-deploy.yml'
  workflow_dispatch:

concurrency:
  group: bot-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bot

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN WEBHOOK_SECRET GITHUB_TOKEN; do
            test -n "${!name}" || { echo "::error::Secret for $name is not set"; exit 1; }
          done
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          jq -n '{TELEGRAM_BOT_TOKEN: env.TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET: env.WEBHOOK_SECRET, GITHUB_TOKEN: env.GITHUB_TOKEN}' > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"
          rm -f "$secrets_file"

      - name: Set Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          BOT_URL: ${{ vars.BOT_URL }}
        run: |
          test -n "$BOT_URL" || { echo "::error::Repository variable BOT_URL is not set"; exit 1; }
          jq -n '{url: env.BOT_URL, secret_token: env.WEBHOOK_SECRET, allowed_updates: ["message", "callback_query"]}' \
            | curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
                -H "Content-Type: application/json" --data @- \
            | jq -e '.ok == true'
