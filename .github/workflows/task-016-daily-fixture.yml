---
name: Daily Horizon Summary
jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.12'
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: 0.11.26
        prune-cache: true
    - name: Install dependencies
      run: uv sync
    - name: Prepare GitHub Actions config
      run: cp .github/task-016-fixture/config.json data/config.json
    - name: Run Horizon
      env:
        PYTHONPATH: ".github/task-016-fixture"
        FIXTURE_AI_KEY: fixture
        FIXTURE_WEBHOOK_URL: https://example.invalid/webhook
      run: uv run horizon --hours 1
    - name: Verify generated fixture digest
      run: grep -F "Task 016 fixture digest content." "data/summaries/horizon-$(date
        -u +%F)-en.md"
'on':
  workflow_call: {}
permissions:
  contents: read
